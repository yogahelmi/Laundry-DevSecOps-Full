name: CD - Build, Scan and Publish Images

on:
  workflow_run:
    workflows: ["CI - Test and Security"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build, scan and publish container images
    runs-on: ubuntu-latest

    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout exactly the source tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase image owner
        id: vars
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build -t laundry-backend:${IMAGE_SHA} ./backend

      - name: Build frontend image
        run: docker build -t laundry-frontend:${IMAGE_SHA} ./frontend

      - name: Scan backend image before publishing
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: laundry-backend:${{ env.IMAGE_SHA }}
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image before publishing
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: laundry-frontend:${{ env.IMAGE_SHA }}
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and publish backend
        env:
          OWNER: ${{ steps.vars.outputs.owner }}
        run: |
          docker tag laundry-backend:${IMAGE_SHA} ghcr.io/${OWNER}/laundry-backend:${IMAGE_SHA}
          docker tag laundry-backend:${IMAGE_SHA} ghcr.io/${OWNER}/laundry-backend:latest
          docker push ghcr.io/${OWNER}/laundry-backend:${IMAGE_SHA}
          docker push ghcr.io/${OWNER}/laundry-backend:latest

      - name: Tag and publish frontend
        env:
          OWNER: ${{ steps.vars.outputs.owner }}
        run: |
          docker tag laundry-frontend:${IMAGE_SHA} ghcr.io/${OWNER}/laundry-frontend:${IMAGE_SHA}
          docker tag laundry-frontend:${IMAGE_SHA} ghcr.io/${OWNER}/laundry-frontend:latest
          docker push ghcr.io/${OWNER}/laundry-frontend:${IMAGE_SHA}
          docker push ghcr.io/${OWNER}/laundry-frontend:latest
